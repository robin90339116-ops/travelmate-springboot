# 生产 profile:MySQL + Redis 缓存 + Redis 广播 + RabbitMQ 异步。
# 启动:--spring.profiles.active=prod,mq,redis  并配置对应环境变量。
spring:
  h2:
    console:
      enabled: false
  rabbitmq:
    listener:
      simple:
        auto-startup: true
        default-requeue-rejected: false
  datasource:
    url: ${DATASOURCE_URL:jdbc:mysql://localhost:3306/travelmate?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8}
    username: ${DATASOURCE_USER:travelmate}
    password: ${DATASOURCE_PASSWORD:travelmate}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      # 生产不再由 Hibernate 改表;schema 由 Flyway 版本化迁移管理,这里只校验实体与表一致。
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 对已由旧版 ddl-auto=update 建好的库,首次启动打基线(视为已在 V1),不重复建表;空库则执行 V1。
    baseline-on-migrate: true
    baseline-version: 1
  cache:
    type: redis

app:
  jwt:
    secret: ${JWT_SECRET}
  sms:
    dev-enabled: false
  async:
    mode: rabbit
  realtime:
    redis: true
