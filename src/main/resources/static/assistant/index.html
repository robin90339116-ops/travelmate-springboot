<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TravelMate · 一起走一段</title><link rel="stylesheet" href="/assistant/style.css"><script src="/assistant/app.js" defer></script></head>
<body><header><a href="/assistant/index.html" class="brand">TravelMate<span>途听</span></a><span class="label">你的城市漫游助手</span></header>
<main><aside><p class="eyebrow">LET THE CITY UNFOLD</p><h1>好路线，<br>从一句话开始。</h1><p class="intro">告诉我你想看什么。一起选地点、比较去处，再把路线调整到刚刚好。</p>
<section class="panel"><h2>开始这段旅程</h2><form id="login-form"><label>手机号<input id="phone" autocomplete="username" inputmode="tel" required maxlength="20"></label><label>密码<input id="password" type="password" autocomplete="current-password" required></label><div class="buttons"><button type="submit">登录</button><button type="button" id="register" class="secondary">注册</button></div></form><div id="account" hidden><p>已登录</p><button id="logout" class="secondary">退出登录</button></div></section>
<form id="trip-form" class="panel"><label>城市<select id="city"><option value="beijing">北京</option><option value="xian">西安</option><option value="chengdu">成都</option></select></label><div class="fields"><label>可用时间（分钟）<input id="duration" type="number" min="15" max="480" value="120" required></label><label>同行人<input id="companions" maxlength="80" placeholder="如：带孩子"></label></div><label>兴趣<input id="interests" maxlength="200" placeholder="如：建筑、安静的街巷"></label><button type="submit">开启新对话</button><p class="hint">修改上方条件后，下一条消息会一起更新。切换城市请开启新对话。</p></form>
<button id="delete" class="quiet">删除当前对话</button></aside>
<section class="conversation"><div class="conversation-heading"><div><p class="eyebrow">YOUR NEXT WALK</p><h2>边聊，边安排。</h2></div><span id="session-status" class="pill">尚未开始</span></div><p class="notice">内置景点是演示资料，开放时间需核实。地图未配置时，路线会明确标为时间未验证。</p><div id="messages" aria-live="polite"><div class="welcome"><span>↗</span><h3>今天，想怎样认识这座城市？</h3><p>试试下面的提问，也可以直接说出你的想法。</p><div class="examples"><button data-prompt="我有两小时，想看建筑，请帮我安排路线。">两小时，看看城市建筑</button><button data-prompt="请比较两个候选景点的停留时间和特点。">帮我比较两个去处</button></div></div></div><form id="message-form"><label class="sr-only" for="message">你的旅行需求</label><textarea id="message" maxlength="2000" rows="2" placeholder="想去哪儿？或继续说：第二站换一个……" required></textarea><button id="send" type="submit">发送 ↗</button></form><p id="status" role="status"></p></section></main></body></html>
